<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lummo Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #151515;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-app-region: drag;
    }

    .splash-card {
      width: 100%;
      height: 100%;
      background: #151515;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .logo-container {
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .logo-img {
      width: 84px;
      height: 84px;
      border-radius: 18px;
      object-fit: contain;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .text-holder {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #FFFFFF;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 12px;
      height: 16px;
      line-height: 16px;
      opacity: 0.95;
    }

    .progress-track {
      width: 320px;
      height: 6px;
      background: #08080a;
      border-radius: 999px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.95), 0 1px 0 rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 5%;
      background: #FFFFFF;
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 3px #FFFFFF;
      transition: width 0.15s ease-out;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="logo-container">
      <img src="Lummo.png" alt="Lummo Studio" class="logo-img" />
    </div>

    <div class="text-holder" id="textHolder">INICIANDO LUMMO STUDIO...</div>

    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <script>
    const fill = document.getElementById('progressFill');
    const text = document.getElementById('textHolder');

    const sequence = [
      { progress: 25, label: "INICIANDO LUMMO STUDIO...", time: 200 },
      { progress: 55, label: "VERIFICANDO SERVICIOS...", time: 600 },
      { progress: 85, label: "CARGANDO CONFIGURACIÓN...", time: 950 },
      { progress: 100, label: "LISTO", time: 1250 }
    ];

    sequence.forEach(step => {
      setTimeout(() => {
        if (fill) fill.style.width = step.progress + '%';
        if (text) text.textContent = step.label;
      }, step.time);
    });
  </script>
</body>
</html>
